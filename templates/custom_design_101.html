<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Open World A4 — Living Landscape</title>
<style>
  :root{
    --sky-top:#8fd3f4;
    --sky-bottom:#e8f9fd;
    --hill-far:#7fb37a;
    --hill-near:#5a9c5c;
    --grass:#4f9a4f;
    --trunk:#6b4a2b;
    --leaf-1:#3f8f4f;
    --leaf-2:#57a860;
    --leaf-3:#2f7a42;
    --sun:#ffe07a;
    --cloud:#ffffff;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#dfe3e6;display:flex;justify-content:center;padding:10mm 0;font-family:sans-serif;}

  .page{
    width:210mm;
    height:297mm;
    position:relative;
    overflow:hidden;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 55%);
    box-shadow:0 0 20px rgba(0,0,0,.2);
  }

  @media print{
    body{background:#fff;padding:0;}
    .page{box-shadow:none;}
  }

  /* ---------- SUN ---------- */
  .sun{
    position:absolute;
    top:14mm;right:26mm;
    width:34mm;height:34mm;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6d8, var(--sun) 70%);
    box-shadow:0 0 40px 10px rgba(255,224,122,.6);
    animation:pulse 4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }

  /* ---------- CLOUDS (drift across sky) ---------- */
  .cloud{
    position:absolute;
    background:var(--cloud);
    border-radius:50px;
    opacity:.9;
    filter:blur(.3px);
  }
  .cloud::before,.cloud::after{
    content:'';
    position:absolute;
    background:var(--cloud);
    border-radius:50%;
  }
  .cloud1{width:38mm;height:9mm;top:20mm;left:-45mm;animation:drift 34s linear infinite;}
  .cloud1::before{width:16mm;height:16mm;top:-8mm;left:5mm;}
  .cloud1::after{width:12mm;height:12mm;top:-5mm;left:20mm;}
  .cloud2{width:26mm;height:7mm;top:38mm;left:-30mm;animation:drift 26s linear infinite;animation-delay:-8s;}
  .cloud2::before{width:11mm;height:11mm;top:-5mm;left:4mm;}
  .cloud2::after{width:9mm;height:9mm;top:-3mm;left:14mm;}
  .cloud3{width:30mm;height:8mm;top:10mm;left:-38mm;animation:drift 42s linear infinite;animation-delay:-20s;}
  .cloud3::before{width:13mm;height:13mm;top:-6mm;left:5mm;}
  .cloud3::after{width:10mm;height:10mm;top:-4mm;left:16mm;}

  @keyframes drift{
    from{transform:translateX(0);}
    to{transform:translateX(300mm);}
  }

  /* ---------- BIRDS ---------- */
  .bird{
    position:absolute;
    width:6mm;height:3mm;
    top:26mm;left:-10mm;
    animation:fly 18s linear infinite;
  }
  .bird::before,.bird::after{
    content:'';
    position:absolute;
    width:3mm;height:1.4mm;
    background:transparent;
    border-top:1.4mm solid #33404a;
    border-radius:50% 50% 0 0/100% 100% 0 0;
    animation:flap 0.7s ease-in-out infinite;
  }
  .bird::before{left:0;transform-origin:right center;}
  .bird::after{left:3mm;transform-origin:left center;transform:scaleX(-1);}
  .bird.b2{top:32mm;animation-delay:-6s;animation-duration:22s;}
  .bird.b3{top:22mm;animation-delay:-12s;animation-duration:16s;}
  @keyframes flap{
    0%,100%{transform:rotateX(0deg);}
    50%{transform:rotateX(60deg);}
  }
  @keyframes fly{
    from{transform:translateX(0) translateY(0);}
    50%{transform:translateX(160mm) translateY(-6mm);}
    to{transform:translateX(320mm) translateY(0);}
  }

  /* ---------- FAR HILLS ---------- */
  .hill-far{
    position:absolute;
    bottom:90mm;left:-10mm;
    width:230mm;height:60mm;
    background:var(--hill-far);
    border-radius:50% 50% 0 0/100% 100% 0 0;
    opacity:.7;
  }

  /* ---------- NEAR HILLS / GROUND ---------- */
  .ground{
    position:absolute;
    bottom:0;left:0;right:0;
    height:120mm;
    background:linear-gradient(to bottom, var(--hill-near), var(--grass) 40%);
    border-radius:50% 50% 0 0/40mm 40mm 0 0;
  }

  /* ---------- WIND SWEEP OVERLAY (subtle moving sheen = visible "hawa") ---------- */
  .wind-sweep{
    position:absolute;
    top:0;bottom:0;left:-40%;
    width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent);
    animation:sweep 6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{
    0%{left:-40%;}
    45%{left:120%;}
    100%{left:120%;}
  }

  /* ---------- TREES ---------- */
  .tree{
    position:absolute;
    bottom:60mm;
    transform-origin:bottom center;
    animation:sway 3.4s ease-in-out infinite;
  }
  .tree .trunk{
    width:5mm;height:26mm;
    background:linear-gradient(to right, #59391d, var(--trunk));
    margin:0 auto;
    border-radius:2px;
  }
  .tree .leaves{position:relative;width:0;height:0;margin:0 auto;}
  .tree .leaves span{
    position:absolute;
    border-radius:50%;
    animation:leafshimmer 2.6s ease-in-out infinite;
  }

  .t1{left:24mm;bottom:64mm;transform:scale(1.15);animation-duration:3.1s;}
  .t2{left:52mm;bottom:58mm;transform:scale(.85);animation-duration:2.6s;animation-delay:-1s;}
  .t3{left:150mm;bottom:66mm;transform:scale(1.3);animation-duration:3.6s;animation-delay:-.5s;}
  .t4{left:178mm;bottom:60mm;transform:scale(.95);animation-duration:2.9s;animation-delay:-1.6s;}
  .t5{left:110mm;bottom:56mm;transform:scale(.75);animation-duration:2.4s;animation-delay:-.8s;}

  @keyframes sway{
    0%,100%{transform:rotate(-3deg) scale(var(--s,1));}
    50%{transform:rotate(3deg) scale(var(--s,1));}
  }
  .t1{--s:1.15;} .t2{--s:.85;} .t3{--s:1.3;} .t4{--s:.95;} .t5{--s:.75;}

  @keyframes leafshimmer{
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.08);}
  }

  /* leaf clusters built with box-shadow circles for a full canopy */
  .leaves .c1{width:22mm;height:22mm;background:var(--leaf-1);top:-46mm;left:-11mm;}
  .leaves .c2{width:18mm;height:18mm;background:var(--leaf-2);top:-40mm;left:-20mm;}
  .leaves .c3{width:18mm;height:18mm;background:var(--leaf-2);top:-40mm;left:2mm;}
  .leaves .c4{width:16mm;height:16mm;background:var(--leaf-3);top:-52mm;left:-6mm;}

  /* ---------- GRASS FIELD (blades sway in wind, staggered) ---------- */
  .grass-field{
    position:absolute;
    bottom:0;left:0;right:0;
    height:26mm;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
  }
  .blade{
    width:1.6mm;
    height:14mm;
    background:linear-gradient(to top, #2f7a35, #63b866);
    margin:0 -0.3mm;
    border-radius:3mm 3mm 0 0;
    transform-origin:bottom center;
    animation:blade-wave 1.8s ease-in-out infinite;
  }

  @keyframes blade-wave{
    0%,100%{transform:rotate(-9deg);}
    50%{transform:rotate(9deg);}
  }

  /* ---------- FLOWER DOTS scattered for life ---------- */
  .flower{
    position:absolute;
    width:3mm;height:3mm;
    border-radius:50%;
    animation:sway 3s ease-in-out infinite;
    transform-origin:bottom center;
  }

  /* ---------- TITLE CARD (optional CV-style header, faded into scene) ---------- */
  .title-card{
    position:absolute;
    top:16mm;left:16mm;
    z-index:5;
  }
  .title-card h1{
    font-family:Georgia,serif;
    font-size:22px;
    color:#1c3d2b;
    text-shadow:0 1px 2px rgba(255,255,255,.6);
  }
  .title-card p{
    font-size:11px;
    color:#2f5c3f;
    margin-top:2px;
  }
</style>
</head>
<body>

<div class="page">

  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <div class="bird b1"></div>
  <div class="bird b2"></div>
  <div class="bird b3"></div>

  <div class="hill-far"></div>

  <div class="wind-sweep"></div>

  <!-- Trees -->
  <div class="tree t1"><div class="leaves"><span class="c2"></span><span class="c3"></span><span class="c1"></span><span class="c4"></span></div><div class="trunk"></div></div>
  <div class="tree t2"><div class="leaves"><span class="c2"></span><span class="c3"></span><span class="c1"></span><span class="c4"></span></div><div class="trunk"></div></div>
  <div class="tree t3"><div class="leaves"><span class="c2"></span><span class="c3"></span><span class="c1"></span><span class="c4"></span></div><div class="trunk"></div></div>
  <div class="tree t4"><div class="leaves"><span class="c2"></span><span class="c3"></span><span class="c1"></span><span class="c4"></span></div><div class="trunk"></div></div>
  <div class="tree t5"><div class="leaves"><span class="c2"></span><span class="c3"></span><span class="c1"></span><span class="c4"></span></div><div class="trunk"></div></div>

  <div class="ground"></div>

  <div class="grass-field" id="grassField"></div>

  <div class="title-card">
    <h1>The Open World</h1>
    <p>A4 living landscape — wind, grass, and trees in motion</p>
  </div>

</div>

<script>
  // Generate a dense field of grass blades with randomized timing so the
  // wind reads as continuous and natural rather than a single repeating loop.
  const field = document.getElementById('grassField');
  const bladeCount = 180;
  for(let i=0;i<bladeCount;i++){
    const b = document.createElement('div');
    b.className = 'blade';
    const h = 10 + Math.random()*8;
    b.style.height = h + 'mm';
    b.style.animationDuration = (1.3 + Math.random()*1.2) + 's';
    b.style.animationDelay = (-Math.random()*2) + 's';
    b.style.filter = 'brightness(' + (0.85 + Math.random()*0.3) + ')';
    field.appendChild(b);
  }
</script>

</body>
</html>
